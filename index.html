---
layout: home
title: FEBU
subtitle: All Ducks All Day, Everyday.
---

<div class="homepage-widgets">

    <div id="scoreboard-widget"></div>

    <div id="standings-widget"></div>

</div>

<div id="febu-ticker">

    <div class="ticker-label">
        🚨 FEBU ALERT
    </div>

    <div class="ticker-message">
        <span id="ticker-text"></span>
    </div>

</div>

<style>

/* Override Beautiful Jekyll width */

.page-content,
.main-content,
.container{

    max-width:1400px !important;

}

/* Homepage Layout */

.homepage-widgets{

    display:flex;

    justify-content:center;

    align-items:stretch;

    gap:25px;

    max-width:1100px;

    margin:0 auto 25px auto;

}

/* Game Widget */

#scoreboard-widget{

    width:725px;

    flex:none;

}

/* Standings Widget */

#standings-widget{

    width:350px;

    flex:0 0 350px;

}

/* Standings Card */

.febu-standings-card{

    background:white;

    border-radius:12px;

    padding:20px;

    border-left:6px solid #013220;

    border-right:6px solid #FEE123;

    box-shadow:
        0 4px 15px rgba(0,0,0,.15),
        0 0 12px rgba(1,50,32,.18);

    height:100%;

    box-sizing:border-box;

}

.febu-standings-card h3{

    margin-top:0;

    margin-bottom:8px;

    text-align:center;

    color:#013220;

    font-size:2rem;

    font-weight:800;

}

.standings-note{

    text-align:center;

    color:#666;

    margin-bottom:20px;

    font-size:.9rem;

    font-style:italic;

}

.standings-row{

    display:flex;

    justify-content:space-between;

    padding:12px 0;

    border-bottom:1px solid #eee;

    font-weight:600;

}

.standings-row:nth-child(3),
.standings-row:nth-child(4){

    background:rgba(254,225,35,.08);

    font-weight:700;

}

.standings-footer{

    text-align:center;

    margin-top:20px;

    padding-top:15px;

    border-top:1px solid #ddd;

    color:#666;

    font-weight:600;

}

/* ESPN-Style Alert Bar */

#febu-ticker{

    display:flex;

    align-items:center;

    margin:20px auto 30px auto;

    max-width:1100px;

    border-radius:8px;

    overflow:hidden;

    box-shadow:0 4px 15px rgba(0,0,0,.15);

}

.ticker-label{

    background:#FEE123;

    color:#013220;

    font-weight:800;

    padding:14px 20px;

    white-space:nowrap;

}

.ticker-message{

    flex:1;

    background:#013220;

    color:white;

    padding:14px 20px;

    font-weight:600;

    text-align:left;

}

#ticker-text{

    display:block;

}

/* Mobile */

@media (max-width: 768px){

    .homepage-widgets{

        flex-direction:column;

        align-items:center;

        max-width:100%;

    }

    #scoreboard-widget{

        width:100%;

        max-width:725px;

    }

    #standings-widget{

        width:100%;

        max-width:400px;

    }

    #febu-ticker{

        flex-direction:column;

    }

    .ticker-label{

        width:100%;

        text-align:center;

    }

    .ticker-message{

        width:100%;

        text-align:center;

    }

}

</style>

<script>

/* ======================
   GAME WIDGET
====================== */

fetch('/assets/data/next-game.json')
  .then(response => response.json())
  .then(game => {

    const kickoff = new Date(game.kickoff + " EDT");

    function updateCountdown() {

      const now = new Date();
      const diff = kickoff - now;

      if (diff <= 0)
      {
        return "GAME DAY!";
      }

      const days =
          Math.floor(diff / (1000 * 60 * 60 * 24));

      const hours =
          Math.floor((diff / (1000 * 60 * 60)) % 24);

      const minutes =
          Math.floor((diff / (1000 * 60)) % 60);

      return `${days}d ${hours}h ${minutes}m`;
    }

    const widget = `

      <div class="scoreboard-widget">

        <div class="sb-countdown">
          Kickoff in:
          <span id="kickoff-timer">
            ${updateCountdown()}
          </span>
        </div>

        <div class="sb-header-row">

          <img
              class="sb-logo-left"
              src="${game.oregonLogo}"
              alt="Oregon">

          <div class="sb-header-center">
            OREGON vs ${game.opponent}
          </div>

          <img
              class="sb-logo-right"
              src="${game.opponentLogo}"
              alt="${game.opponent}">

        </div>

        <div class="sb-details">

          <p>
            <strong>Date:</strong>
            ${game.date} — ${game.time}
          </p>

          <p>
            <strong>TV:</strong>
            ${game.tv}
          </p>

          <p>
            <strong>Oregon Record:</strong>
            ${game.oregonRecord}
          </p>

          <p>
            <strong>${game.opponent} Record:</strong>
            ${game.opponentRecord}
          </p>

          <p>
            <strong>FEBU Spread:</strong>
            ${game.spread}
          </p>

          <div class="chaos-meter-container">

            <div class="chaos-meter-bar">
              <div class="chaos-meter-fill"
                   id="chaos-fill"></div>
            </div>

            <div class="chaos-meter-percent"
                 id="chaos-percent">

              Chaos Level : 42%

            </div>

          </div>

        </div>

      </div>

    `;

    document.getElementById(
      'scoreboard-widget'
    ).innerHTML = widget;

    setInterval(() => {

      const timer =
          document.getElementById(
              'kickoff-timer'
          );

      if(timer)
      {
          timer.innerText =
              updateCountdown();
      }

    }, 60000);

  });

/* ======================
   STANDINGS WIDGET
====================== */

fetch('/assets/data/standings.json')
    .then(response => response.json())
    .then(data => {

        let html = `

        <div class="febu-standings-card">

            <h3>${data.headline}</h3>

            <div class="standings-note">
                ${data.subtitle}
            </div>

        `;

        data.standings.forEach(player => {

            html += `

            <div class="standings-row">

                <span>
                    ${player.place}. ${player.name}
                </span>

                <span>
                    ${player.points}
                </span>

            </div>

            `;

        });

        html += `

    <div class="standings-footer">

        Tightest Race Of The Season 🏆

    </div>

</div>

`;

        document
            .getElementById(
                "standings-widget"
            )
            .innerHTML = html;

    });

/* ======================
   ALERT TICKER
====================== */

fetch('/assets/data/alerts.json')
    .then(response => response.json())
    .then(data => {

        const febuAlerts =
            data.alerts;

        let currentAlert = 0;

        function rotateFEBUAlert()
        {
            document
                .getElementById(
                    "ticker-text"
                )
                .innerHTML =
                    febuAlerts[
                        currentAlert
                    ];

            currentAlert++;

            if(currentAlert >= febuAlerts.length)
            {
                currentAlert = 0;
            }
        }

        rotateFEBUAlert();

        setInterval(
            rotateFEBUAlert,
            5000
        );
    });

</script>
