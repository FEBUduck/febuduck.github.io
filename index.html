---
layout: home
title: FEBU
subtitle: All Ducks All Day, Everyday.
---
<div id="scoreboard-widget"></div>

<script>
fetch('/assets/data/next-game.json')
  .then(response => response.json())
  .then(game => {

   function updateCountdown() {
  const kickoff = new Date(game.kickoff + " PST");
  const now = new Date();
  const diff = kickoff - now;

  if (diff <= 0) {
    const timer = document.getElementById('kickoff-timer');
    timer.innerText = "GAME DAY!";
    timer.classList.add("gameday-flash");
    return "GAME DAY!";
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);

  return `${days}d ${hours}h ${minutes}m`;
}


    const widget = `
      <div class="scoreboard-widget">
        <div class="sb-countdown">
          Kickoff in: <span id="kickoff-timer">${updateCountdown()}</span>
        </div>

        <div class="sb-header-row">
  <img class="sb-logo-left" src="${game.oregonLogo}" alt="Oregon logo">

  <div class="sb-header-center">
    OREGON vs ${game.opponent}
  </div>

  <img class="sb-logo-right" src="${game.opponentLogo}" alt="${game.opponent} logo">
</div>



        <div class="sb-details">
          <p><strong>Date:</strong> ${game.date} — ${game.time}</p>
          <p><strong>TV:</strong> ${game.tv}</p>
          <p><strong>Oregon Record:</strong> ${game.oregonRecord}</p>
          <p><strong>${game.opponent} Record:</strong> ${game.opponentRecord}</p>
          <p><strong>FEBU Spread:</strong> ${game.spread}</p>
          <div class="chaos-meter-container">
  <div class="chaos-meter-bar">
    <div class="chaos-meter-fill" id="chaos-fill"></div>
  </div>
  <div class="chaos-meter-percent" id="chaos-percent">0%</div>
</div>

        </div>
      </div>
    `;

    document.getElementById('scoreboard-widget').innerHTML = widget;

    setInterval(() => {
      document.getElementById('kickoff-timer').innerText = updateCountdown();
    }, 60000); // update every minute

    // --- CHAOS METER LOGIC ---
function updateChaosMeter() {
  const kickoff = new Date(game.kickoff + " PST");
  const now = new Date();

  // 30-day window before kickoff
  const total = kickoff - new Date(
    kickoff.getFullYear(),
    kickoff.getMonth(),
    kickoff.getDate() - 30
  );

  const remaining = kickoff - now;

  // Convert remaining time into a % (0 → 100)
  let chaos = 100 - Math.max(0, Math.min(100, (remaining / total) * 100));
  chaos = Math.round(chaos);

  const fill = document.getElementById("chaos-fill");
  const percent = document.getElementById("chaos-percent");

  let displayChaos = Math.max(42, chaos);

fill.style.width = displayChaos + "%";
percent.innerText = displayChaos + "%";


  // Flash at 100%
  if (chaos >= 100) {
    fill.classList.add("chaos-flash");
  }
}

// Update chaos meter every minute
setInterval(updateChaosMeter, 60000);
updateChaosMeter();

  });
</script>
